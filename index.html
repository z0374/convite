<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Ayla Liz • 1 Aninho</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- FLORES ANIMADAS -->
<div class="flores">
  <span>🌸</span><span>🌷</span><span>🌼</span>
  <span>🌸</span><span>🌷</span><span>🌼</span>
</div>

<audio autoplay loop>
  <source src="musica.mp3" type="audio/mpeg">
</audio>

<div class="convite">
  <img src="img/ayla.jpg" class="foto">

  <h1>🌸 Jardim Encantado 🌸</h1>
  <h2>Ayla Liz</h2>
  <p class="idade">1 aninho</p>

  <p class="texto">
    Com muito amor, convidamos você para comemorar
    o primeiro aninho da nossa princesa 💕
  </p>

  <div class="info">
    <p>📅 <strong>20 de Abril</strong></p>
    <p>⏰ <strong>16h</strong></p>
    <p>📍 <strong>Nosso Jardim Encantado</strong></p>
  </div>

  <div class="contador">
    🌷 Confirmados:
    <span id="totalConfirmados">0</span>
  </div>

 <div class="confirmacao">
  <input type="text" id="nome" placeholder="Nome da família">
  <div class="qtd-container">
  <span class="label-qtd">👨‍👩‍👧 Pessoas</span>

 <div class="qtd-container">
  <span class="label-qtd">👨‍👩‍👧 Pessoas</span>

  <div class="qtd-box">
    <button type="button" class="qtd-btn" onclick="alterarQtd(-1)">
      <svg viewBox="0 0 24 24">
        <path d="M19 13H5v-2h14v2z"/>
      </svg>
    </button>

    <input type="text" id="qtd" value="1" readonly>

    <button type="button" class="qtd-btn" onclick="alterarQtd(1)">
      <svg viewBox="0 0 24 24">
        <path d="M19 13H13v6h-2v-6H5v-2h6V5h2v6h6v2z"/>
      </svg>
    </button>
  </div>
</div>


  <button onclick="confirmar()">Confirmar Presença</button>
  <p id="mensagem"></p>
</div>


<script src="script.js"></script>
</body>
</html>
